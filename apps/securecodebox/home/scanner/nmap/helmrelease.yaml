---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nmap
spec:
  chartRef:
    kind: OCIRepository
    name: nmap
  interval: 24h0m0s
  values:
    parser:
      image:
        tag: 5.1.0
      ttlSecondsAfterFinished: 10
    scanner:
      image:
        tag: 7.97-r0 
      ttlSecondsAfterFinished: 10
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        capabilities:
          add:
            - NET_RAW
            - NET_ADMIN
          drop:
            - ALL
