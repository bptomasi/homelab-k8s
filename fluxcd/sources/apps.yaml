---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-source
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infra-config
      namespace: flux-system
