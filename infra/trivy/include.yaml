---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trivy-install
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./infra/trivy/install
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: aqua-install
      namespace: flux-system
