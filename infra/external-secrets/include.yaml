---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-base
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./infra/external-secrets/base
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
