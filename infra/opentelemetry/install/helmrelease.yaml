---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-operator
  namespace: opentelemetry
spec:
  chart:
    spec:
      chart: opentelemetry-operator
      sourceRef:
        kind: HelmRepository
        name: opentelemetry
        namespace: opentelemetry
  targetNamespace: opentelemetry
  interval: 24h0m0s
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    replicaCount: 1
