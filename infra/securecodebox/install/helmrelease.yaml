---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: operator
  namespace: securecodebox
spec:
  chartRef:
    kind: OCIRepository
    name: operator
    namespace: securecodebox
  interval: 24h0m0s
  values:
    image:
      tag: 5.1.0
    lurker:
      image:
        tag: 5.1.0
    minio:
      resources:
        limits:
          ephemeral-storage: 0
      persistence:
        size: 1Gi
