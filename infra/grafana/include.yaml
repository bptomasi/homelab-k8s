---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-install
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./infra/grafana/install
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
