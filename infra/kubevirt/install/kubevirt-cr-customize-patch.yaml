---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  customizeComponents:
    patches:
      - resourceType: Deployment
        resourceName: virt-controller
        patch: '[{"op": "replace", "path": "/spec/replicas", "value": 1}]'
        type: json
