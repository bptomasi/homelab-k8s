---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-install
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./infra/cilium/install
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-resources
  namespace: flux-system
spec:
  interval: 30m0s
  path: ./infra/cilium/resources
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cilium-install
      namespace: flux-system
