---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kiali
  namespace: kiali
spec:
  chart:
    spec:
      chart: kiali-operator
      sourceRef:
        kind: HelmRepository
        name: kiali
        namespace: kiali
  targetNamespace: kiali
  install:
    disableWait: true
  upgrade:
    disableWait: true
  uninstall:
    disableWait: true
  interval: 24h
