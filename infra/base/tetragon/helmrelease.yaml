---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tetragon
  namespace: tetragon
spec:
  chart:
    spec:
      chart: tetragon
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: cilium
  interval: 24h0m0s
  targetNamespace: kube-system
  values:
    tetragon:
      prometheus:
        enabled: false
