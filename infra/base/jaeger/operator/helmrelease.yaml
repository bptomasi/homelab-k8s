---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jaeger-operator
  namespace: jaeger-operator
spec:
  chart:
    spec:
      chart: jaeger-operator
      sourceRef:
        kind: HelmRepository
        name: jaeger
        namespace: jaeger
  targetNamespace: jaeger-operator
  interval: 24h0m0s
  values:
    certs:
      issuer:
        create: false
        name: selfsigned-issuer
      certificate:
        issuerKind: ClusterIssuer

